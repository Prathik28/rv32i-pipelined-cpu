name: test-and-publish

# Code is pushed to the `staging` branch. This workflow runs the test-suite and,
# only if it passes, Actions commits the result to `main` as the repo owner.
on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog and Yosys
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run test-suite (RTL vs golden ISS)
        run: make test
      - name: Synthesis check (Xilinx 7-series, Yosys)
        run: make synth
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-report
          path: build/synth_stat.txt

  # Place & route for a Lattice ECP5 with the open-source toolchain: gives an Fmax *estimate*
  # without any local install or board. Informational only (does not gate publishing).
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-11-23'
      - name: Place and route (ECP5, nextpnr)
        shell: bash
        run: |
          mkdir -p build
          sw/ecp5_timing.sh | tee build/ecp5_summary.txt
      - name: Job summary
        if: always()
        run: |
          { echo '### ECP5 place-and-route estimate (nextpnr, LFE5U-25F, speed grade 6)';
            echo '```'; cat build/ecp5_summary.txt 2>/dev/null || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecp5-timing
          path: build/ecp5_*

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Commit staging snapshot to main
        run: |
          git config user.name  "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          MSG="$(git log -1 --format=%B origin/staging)"
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch origin main
            git checkout -B main origin/main
            git rm -rfq .
          else
            git checkout --orphan main
            git rm -rfq .
          fi
          git checkout origin/staging -- .
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "$MSG"
          git push origin main
